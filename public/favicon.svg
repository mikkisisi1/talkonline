<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0369A1"/>
      <stop offset="100%" style="stop-color:#0891B2"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <g fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
    <!-- Planet circle -->
    <circle cx="50" cy="50" r="18"/>
    <!-- Orbital ring -->
    <ellipse cx="50" cy="50" rx="32" ry="10" transform="rotate(-30 50 50)"/>
    <!-- Satellite dot -->
    <circle cx="75" cy="32" r="3" fill="white"/>
  </g>
</svg>